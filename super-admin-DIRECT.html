<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin Direct</title><link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/><script src="https://unpkg.com/leaflet/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;display:flex}.side{width:230px;background:#0f172a;color:#fff;height:100vh;position:fixed;padding:12px;overflow-y:auto}.side div{padding:10px 12px;border-radius:8px;margin:4px 0;cursor:pointer;font-size:12px;color:#cbd5e1}.side .act{background:#1e293b;color:#60a5fa!important}.main{margin-left:230px;flex:1;padding:12px}.c{background:#fff;padding:10px;border-radius:10px;text-align:center;border:1px solid #e2e8f0}.box{background:#fff;padding:14px;border-radius:12px;margin-top:12px}#map,#mapLive{height:300px;border-radius:12px;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:9999;justify-content:center;align-items:center}.modal-in{background:#fff;padding:20px;border-radius:14px;width:95%;max-width:600px}input,select,button{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #cbd5e1}button{background:#0f172a;color:#fff;font-weight:700}</style></head><body>
<div class="side"><b>🌾 SUPER ADMIN - DIRECT</b><div class="act" onclick="tab('dash')">📊 Dashboard</div><div onclick="tab('order')">🛒 Orders + Live</div><div onclick="tab('prod')">📦 Products</div><div onclick="tab('loc')">📍 Location</div><div onclick="tab('pay')">💳 Payment</div><div onclick="tab('super')">👑 Sub Admins</div><div onclick="localStorage.clear();location.reload()" style="background:#ef4444;text-align:center;color:#fff;margin-top:20px">🚪 Clear & Reload</div></div>
<div class="main">
<div id="dashTab"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="c">TOTAL ORDERS<b id="tT">1</b></div><div class="c">PENDING<b id="tP">1</b></div><div class="c">DELIVERED<b>0</b></div></div><div class="box"><b>Recent Orders - Live</b><div id="recent"></div><button onclick="tab('order')" style="margin-top:10px;background:#16a34a">Go to Orders & Live Map</button></div></div>
<div id="orderTab" style="display:none"><div class="box"><b>Orders + Live Map OSM FREE</b><div id="oList"></div></div></div>
<div id="prodTab" style="display:none"><div class="box"><b>Products</b><input id="pName" placeholder="Product Name"><input id="pPrice" placeholder="Price"><button onclick="addP()">Add</button><div id="pList"></div></div></div>
<div id="locTab" style="display:none"><div class="box"><b>Location 10KM OSM FREE</b><div id="map"></div></div></div>
<div id="payTab" style="display:none"><div class="box"><b>Payment Gateway - Add</b><div id="payList"></div><button onclick="addPay()" style="background:#16a34a">+ Add COD Active</button></div></div>
<div id="superTab" style="display:none"><div class="box"><b>Sub Admins</b><input id="subU" placeholder="Username"><input id="subP" placeholder="Password"><select id="subR"><option>Admin (Store)</option><option>Delivery Admin - Live</option></select><button onclick="addSub()">Create</button><div id="subList"></div></div></div>
</div>
<div class="modal" id="liveModal"><div class="modal-in"><b>📍 Live Map - OSM FREE</b><div id="mapLive"></div><div id="liveInfo" style="background:#f0fdf4;padding:8px;border-radius:8px;margin-top:8px"></div><button onclick="document.getElementById('liveModal').style.display='none'" style="margin-top:10px">Close</button></div></div>
<script>
let ORDERS=JSON.parse(localStorage.getItem('my_orders')||'[]');if(ORDERS.length==0)ORDERS=[{id:15,customer:'Arvind Kumar',total:237,status:'pending',lat:24.8812,lng:87.9310,liveLat:24.8812,liveLng:87.9310}];
let PRODS=JSON.parse(localStorage.getItem('dx_prods')||'[]');
let map,mapLive,curLive;
function tab(t){document.querySelectorAll('.main>div').forEach(d=>d.style.display='none');document.getElementById(t+'Tab').style.display='block';if(t=='dash'){document.getElementById('tT').innerText=ORDERS.length;document.getElementById('recent').innerHTML=ORDERS.map(o=>`<div style="padding:8px;border-bottom:1px solid #eee">#${o.id} ${o.customer} ₹${o.total} <button onclick="openLive(${ORDERS.indexOf(o)})" style="width:auto;padding:4px 8px;background:#7c3aed">Live Map</button></div>`).join('');}if(t=='order'){document.getElementById('oList').innerHTML=ORDERS.map(o=>`<div style="border:1px solid #eee;padding:10px;border-radius:8px;margin:6px 0"><b>#${o.id}</b> ${o.customer} ₹${o.total} - ${o.status} <br><button onclick="openLive(${ORDERS.indexOf(o)})" style="background:#16a34a;margin-top:6px">📍 Live Map FREE</button></div>`).join('');}if(t=='prod'){document.getElementById('pList').innerHTML=PRODS.map(p=>`<div style="padding:6px;border-bottom:1px solid #eee">${p.name} ₹${p.price}</div>`).join('')||'No Products';}if(t=='loc'){setTimeout(()=>{if(!map){map=L.map('map').setView([24.8765,87.9248],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);L.marker([24.8765,87.9248]).addTo(map).bindPopup("Store");L.circle([24.8765,87.9248],{radius:10000,color:'#16a34a',fillOpacity:0.1}).addTo(map);}},300);}if(t=='pay'){let P=JSON.parse(localStorage.getItem('payment_gateways')||'[]');document.getElementById('payList').innerHTML=P.map(p=>`<div style="padding:6px;border:1px solid #eee;margin:4px 0">${p.type} Active</div>`).join('')||'COD Active';}if(t=='super'){let S=JSON.parse(localStorage.getItem('sub_admins')||'[]');document.getElementById('subList').innerHTML=S.map(s=>`<div style="padding:6px;border:1px solid #eee">${s.username} - ${s.role}</div>`).join('')||'No Sub Admins';}}
function openLive(i){curLive=ORDERS[i];document.getElementById('liveModal').style.display='flex';setTimeout(()=>{try{if(mapLive){mapLive.remove();mapLive=null;}mapLive=L.map('mapLive').setView([curLive.liveLat,curLive.liveLng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapLive);L.marker([24.8765,87.9248]).addTo(mapLive).bindPopup("Store");L.marker([curLive.liveLat,curLive.liveLng]).addTo(mapLive).bindPopup("Customer Live");L.marker([(24.8765+curLive.liveLat)/2,(87.9248+curLive.liveLng)/2]).addTo(mapLive).bindPopup("Delivery Boy Live");L.polyline([[24.8765,87.9248],[curLive.liveLat,curLive.liveLng]],{color:'#16a34a'}).addTo(mapLive);let d=(mapLive.distance([24.8765,87.9248],[curLive.liveLat,curLive.liveLng])/1000).toFixed(2);document.getElementById('liveInfo').innerHTML=`Distance ${d} KM | ETA ${Math.ceil(d/18*60)} mins | OSM FREE`;}catch(e){}},400);}
function addP(){let n=document.getElementById('pName').value;let pr=document.getElementById('pPrice').value;PRODS.push({name:n,price:pr});localStorage.setItem('dx_prods',JSON.stringify(PRODS));tab('prod');}function addPay(){let P=JSON.parse(localStorage.getItem('payment_gateways')||'[]');P.push({type:'COD',status:'Active'});localStorage.setItem('payment_gateways',JSON.stringify(P));tab('pay');}function addSub(){let u=document.getElementById('subU').value;let S=JSON.parse(localStorage.getItem('sub_admins')||'[]');S.push({username:u,role:document.getElementById('subR').value});localStorage.setItem('sub_admins',JSON.stringify(S));tab('super');}
tab('dash');
</script></body></html>
