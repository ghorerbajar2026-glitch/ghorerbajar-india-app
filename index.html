<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghorer Bajar India</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f5}
.header{background:#0a8a28;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.banner{width:100%;height:180px;overflow-x:auto;display:flex;scroll-snap-type:x mandatory}
.banner img{width:100%;flex:0 0 100%;scroll-snap-align:start;object-fit:cover}
.cat{display:flex;gap:10px;padding:10px;overflow-x:auto}
.cat button{padding:8px 16px;border-radius:20px;border:1px solid #0a8a28;background:#fff;white-space:nowrap}
.cat button.active{background:#0a8a28;color:#fff}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 5px #0001}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.btn{background:#0a8a28;color:#fff;border:none;padding:6px 12px;border-radius:6px;width:100%;margin-top:6px}
.coupon{background:linear-gradient(90deg,#ff9800,#ff5722);color:#fff;padding:12px;margin:10px;border-radius:10px;display:flex;justify-content:space-between}
.nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd}
#cartCount{background:red;color:#fff;border-radius:50%;padding:2px 6px;font-size:12px}
</style>
</head>
<body>
<div class="header">
  <b>🛒 Ghorer Bajar India</b>
  <div><span onclick="showLogin()">👤</span> <span>Cart <span id="cartCount">0</span></span></div>
</div>

<div class="banner" id="banner"></div>

<div style="padding:10px">
<h3>🔥 Short Videos</h3>
<div id="videos" style="display:flex;gap:10px;overflow-x:auto"></div>
</div>

<div class="cat" id="categories">
  <button class="active" onclick="filterCat('all')">All</button>
  <button onclick="filterCat('Daily Essential')">Daily Essential</button>
  <button onclick="filterCat('Best Seller')">Best Seller</button>
  <button onclick="filterCat('Hot Deals')">Hot Deals</button>
</div>

<div id="couponArea"></div>
<div class="products" id="productList">Loading...</div>

<div style="height:70px"></div>
<div class="nav">
  <div onclick="location.reload()">🏠 Home</div>
  <div onclick="showCart()">🛒 Cart</div>
  <div onclick="showOrders()">📦 Orders</div>
  <div onclick="showAccount()">👤 Account</div>
</div>

<script>
const API='https://ghorerbajar.in/api_india';
let allProducts=[], cart=JSON.parse(localStorage.getItem('cart')||'[]');
let user=JSON.parse(localStorage.getItem('user')||'null');

async function loadAll(){
  // Banners
  try{
    let b=await fetch(API+'/banners.php').then(r=>r.json());
    document.getElementById('banner').innerHTML=b.map(x=>`<img src="${x.image}">`).join('');
    let v=b.filter(x=>x.type=='short_video');
    document.getElementById('videos').innerHTML=v.map(x=>`<video src="${x.image}" style="width:120px;height:180px;border-radius:10px" controls></video>`).join('') || '<p>No videos</p>';
  }catch(e){document.getElementById('banner').innerHTML='<img src="https://via.placeholder.com/400x180?text=Ghorer+Bajar+India">'}

  // Products
  let p=await fetch(API+'/products.php').then(r=>r.json());
  allProducts=p;
  showProducts(p);

  // Coupons
  try{
    let c=await fetch(API+'/coupons.php').then(r=>r.json());
    document.getElementById('couponArea').innerHTML=c.map(x=>`<div class="coupon"><span>🎁 ${x.code} - ${x.discount} OFF</span><button onclick="applyCoupon('${x.code}')" style="background:#fff;border:none;padding:4px 8px;border-radius:4px">Apply</button></div>`).join('');
  }catch(e){}
  updateCartCount();
}

function showProducts(list){
  document.getElementById('productList').innerHTML=list.map(p=>`
    <div class="card">
      <img src="${p.image || 'https://via.placeholder.com/200'}">
      <b>${p.name}</b><br>
      <small>${p.category||''}</small><br>
      <b style="color:green">₹${p.price}</b>
      <button class="btn" onclick='addToCart(${JSON.stringify(p)})'>Add to Cart</button>
    </div>
  `).join('');
}

function filterCat(cat){
  document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(cat=='all') showProducts(allProducts);
  else showProducts(allProducts.filter(p=>(p.category||'').toLowerCase().includes(cat.toLowerCase()) || Math.random()>0.5));
}

function addToCart(p){ cart.push(p); localStorage.setItem('cart',JSON.stringify(cart)); updateCartCount(); alert('Added to Cart!')}
function updateCartCount(){ document.getElementById('cartCount').innerText=cart.length }

function showCart(){
  if(cart.length==0) return alert('Cart Empty');
  let total=cart.reduce((s,p)=>s+parseFloat(p.price||0),0);
  let txt=cart.map(p=>p.name+' - ₹'+p.price).join('\n');
  if(confirm(txt+'\n\nTotal: ₹'+total+'\n\nOrder Now?')){
    if(!user) return showLogin();
    fetch(API+'/orders.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.id||1,total_amount:total,items:cart})})
    .then(r=>r.json()).then(d=>{alert('Order Success! ID: '+d.order_id); cart=[]; localStorage.setItem('cart','[]'); updateCartCount();});
  }
}

function showLogin(){
  let phone=prompt('Enter Phone:');
  if(!phone) return;
  let pass=prompt('Enter Password (or leave for new):');
  fetch(API+'/business.php?phone='+phone).then(r=>r.json()).then(d=>{
    if(d.status=='success'){ user=d.user; localStorage.setItem('user',JSON.stringify(user)); alert('Welcome '+user.phone); }
    else{ alert('New user! Please Register in API'); }
  });
}
function showOrders(){ alert('Order History - Coming from API: '+API+'/orders.php?user_id='+(user?.id||1)) }
function showAccount(){ alert(user ? 'My Account\nPhone: '+user.phone : 'Please Login First'); }
function applyCoupon(code){ alert('Coupon '+code+' Applied!'); }

loadAll();
</script>
</body>
</html>
