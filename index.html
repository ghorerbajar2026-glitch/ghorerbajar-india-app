<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghorer Bajar - ঘরে বসে ঘরের বাজার</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f9f3;padding-bottom:80px}
.top{background:#0f7a3a;color:#fff;padding:10px 14px 16px;border-radius:0 0 22px 22px}
.logo{background:#fff;border-radius:14px;padding:10px;display:flex;justify-content:center;align-items:center}
..logo{background:#fff;border-radius:14px;padding:14px 6px;display:flex;justify-content:center}
.logo img{width:100%;height:80px;object-fit:contain;transform:scale(1.2)}
.head{display:flex;justify-content:space-between;margin-top:10px;font-weight:600;font-size:13px}
.loc{background:#fff;color:#111;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block;margin-top:8px}
.search{background:#fff;border:2.5px solid #f0b429;border-radius:12px;padding:10px 12px;display:flex;gap:6px;margin-top:10px}
.search input{flex:1;border:none;outline:none;font-size:14px}
.ban{display:flex;gap:10px;overflow-x:auto;padding:12px}
.ban-card{min-width:90%;height:140px;background:#fff;border-radius:16px;box-shadow:0 4px 12px #0001;display:flex;align-items:center;justify-content:center;padding:12px}
.ban-card img{width:100%;height:100%;object-fit:contain;transform:scale(1.15)}
.ban-card{height:180px}
.sec{padding:10px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
.sec:after{content:'';flex:1;height:2px;background:#222}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 12px}
.c{text-align:center}
.c div{width:60px;height:60px;background:#e8f5e9;border-radius:16px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:22px}
.c p{font-size:10px;font-weight:700}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.p{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 6px #0001}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-radius:16px 16px 0 0;border-top:1px solid #eee}
.nav div{font-size:11px;opacity:.6;text-align:center}.nav .act{opacity:1;color:#0f7a3a;font-weight:800}
.coupon{background:linear-gradient(90deg,#ff8c00,#ff6500);color:#fff;margin:8px 10px;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;font-weight:700}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><img src="Gemini_Generated_Image_z4udd8z4udd8z4ud.png" alt="Ghorer Bajar Logo"></div>
  <div class="head"><div><small>Deliver in</small><br><b style="font-size:22px">90 Minutes</b></div><div>Md M Hosossain 👤</div></div>
  <div class="loc">📍 Kaliachak 3, Gopalpur</div>
  <div class="search">🔍 <input id="s" placeholder="Search Groceries" onkeyup="srch()"></div>
</div>

<div class="ban">
  <div class="ban-card"><img src="Gemini_Generated_Image_z4udd8z4udd8z4ud.png"></div>
  <div class="ban-card"><img src="IMG_20260616_222420.png" style="display:none" onerror="this.parentElement.style.background='url(https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=600) center/cover'"></div>
</div>

<div class="sec">Category</div>
<div class="cats">
  <div class="c"><div>🤝</div><p>B2B</p></div><div class="c"><div>🛒</div><p>Groceries</p></div><div class="c"><div>🍞</div><p>Dairy</p></div><div class="c"><div>🔌</div><p>Electronics</p></div>
  <div class="c"><div>🥦</div><p>Fruits</p></div><div class="c"><div>🍦</div><p>Ice Creams</p></div><div class="c"><div>🍳</div><p>Kitchen</p></div><div class="c"><div>🫙</div><p>Oil & Masala</p></div>
</div>

<div id="cp"></div>
<div class="sec" style="margin-top:8px">Everyday Essentials</div>
<div class="prods" id="plist">Loading...</div>

<div class="nav">
  <div class="act">🏠<br>Home</div><div>⊞<br>Category</div><div>👜<br>Cart <b id="cc" style="background:red;color:#fff;border-radius:50%;padding:0 5px">0</b></div><div>♡<br>Wishlist</div>
</div>

<script>
const API='https://ghorerbajar.in/api_india';
let ALL=[], CART=JSON.parse(localStorage.getItem('cart')||'[]');
async function ld(){
 try{ let c=await fetch(API+'/coupons.php').then(r=>r.json()); document.getElementById('cp').innerHTML=c.map(x=>`<div class=coupon><span>🎉 ${x.code}</span><span>${x.discount}% OFF</span></div>`).join('') }catch(e){}
 try{ let p=await fetch(API+'/products.php').then(r=>r.json()); ALL=p; sh(p) }catch(e){ sh([{product_name:'Chal Miniket 25kg',selling_price:1150,image:''},{product_name:'Soyabean Oil 15L',selling_price:1950,image:''}]) }
 up()
}
function sh(l){ document.getElementById('plist').innerHTML=l.map(p=>`<div class=p><img src="${p.image||'https://via.placeholder.com/200'}" style="width:100%;height:90px;border-radius:8px;object-fit:cover"><b style="font-size:11px">${(p.product_name||'Product').slice(0,26)}</b><div style="color:#0f7a3a;font-weight:800">₹${p.selling_price||0}</div><button style="width:100%;background:#0f7a3a;color:#fff;border:none;padding:6px;border-radius:6px;margin-top:4px;font-weight:700" onclick='ad(${JSON.stringify(p).replace(/'/g,"")})'>Add</button></div>`).join('') }
function ad(p){ CART.push(p); localStorage.setItem('cart',JSON.stringify(CART)); up(); alert('Added to Cart') }
function up(){ document.getElementById('cc').innerText=CART.length }
function srch(){ let q=document.getElementById('s').value.toLowerCase(); sh(ALL.filter(x=>(x.product_name||'').toLowerCase().includes(q))) }
ld();
</script>
</body>
</html>
