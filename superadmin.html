<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Super Admin FIXED - Ghorer Bajar</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f9f3}.top{background:#0f7a3a;color:#fff;padding:14px;text-align:center;font-weight:800}.box{background:#fff;margin:12px;padding:14px;border-radius:14px;box-shadow:0 2px 8px #0001}input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd}button{background:#0f7a3a;color:#fff;font-weight:800;border:none}.hidden{display:none}</style></head><body>
<div class="top">👑 Ghorer Bajar - Super Admin FIXED</div>
<div id="loginBox" class="box" style="margin-top:30px"><h3>🔐 Login FIXED</h3><p style="font-size:11px;color:red;font-weight:700">⚠️ যদি Login না হয়, নিচে Reset Button চাপো!</p><input id="u" placeholder="Username - ex: superadmin"><input id="p" type="password" placeholder="Password - ex: superadmin123"><button onclick="login()" style="font-size:16px">✅ Login</button><button onclick="resetAll()" style="background:#ff4444;margin-top:12px">🔄 Clear Cache & Reset All Logins</button><div style="font-size:12px;background:#f0faf2;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #0f7a3a"><b>✅ Correct Login:</b><br>Super: <b>superadmin</b> / <b>superadmin123</b><br>Admin: <b>admin</b> / <b>admin123</b><br>Delivery: <b>delivery</b> / <b>delivery123</b><br><br><small>Space ছাড়া type করো, Copy Paste করো না</small></div></div>
<div id="dash" class="hidden"><div class="box"><h3>✅ Login Success!</h3><p>Welcome <b id="who"></b></p><button onclick="logout()" style="background:#ff4444">Logout</button><div id="content" style="margin-top:20px"></div></div></div>
<script>
function getUsers(){return [{username:'superadmin',password:'superadmin123',role:'super'},{username:'admin',password:'admin123',role:'admin'},{username:'delivery',password:'delivery123',role:'delivery'}];}
function login(){let u=document.getElementById('u').value.trim();let p=document.getElementById('p').value.trim();console.log('Trying:',u,p);let USERS=getUsers();let f=USERS.find(x=>x.username.toLowerCase()==u.toLowerCase() && x.password==p);if(!f){let custom=JSON.parse(localStorage.getItem('gb_users_custom')||'[]');f=custom.find(x=>x.username.toLowerCase()==u.toLowerCase() && x.password==p);}if(!f){alert('❌ Wrong! Username: '+u+' Password: '+p+' not found. Reset Button চাপো!');return;}localStorage.setItem('gb_cur',JSON.stringify(f));showDash();}
function showDash(){let c=JSON.parse(localStorage.getItem('gb_cur'));if(!c)return;document.getElementById('loginBox').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('who').innerText=c.username+' ('+c.role+')';document.getElementById('content').innerHTML=`<div style="background:#f5f9f3;padding:12px;border-radius:10px"><h4>💰 Dashboard Loading...</h4><p>Role: ${c.role}</p><p>App: Ghorer Bajar India</p><button onclick="goFull()" style="margin-top:10px;background:#2196f3">Go to Full Pro Dashboard</button></div>`;}
function goFull(){let code=localStorage.getItem('gb_pro_code');if(!code){alert('Full Code Load করো - নিচে Link থেকে Full Code নাও');window.location.href='https://ghorerbajar2026-glitch.github.io/ghorerbajar-india-app/superadmin-pro.html';}else{document.body.innerHTML=code;}}
function resetAll(){if(confirm('সব Login Reset করবো?')){localStorage.removeItem('gb_users');localStorage.removeItem('gb_cur');localStorage.removeItem('gb_users_custom');alert('✅ Reset Done! এবার superadmin / superadmin123 দিয়ে Login করো');location.reload();}}
function logout(){localStorage.removeItem('gb_cur');location.reload();}
let cur=localStorage.getItem('gb_cur');if(cur)showDash();
</script></body></html>
